<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <title>Planetary Facts at a Glance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
  

    <main>
        <div class="container">
                <section class="search-section" aria-label="Search planets">
                        <form id="planet-search-form" class="search-form">
                            <label for="planet-search" class="visually-hidden">
                                Search planet name
                            </label>
                            <div class="search-box">
                                <span class="search-icon" aria-hidden="true">
                                    <img src="assets/icons/search Icon.svg" alt="Search icon">
                                </span>
                                <input type="search" id="planet-search" name="planet" placeholder="Search planet name..." autocomplete="off">
                                <span class="search-error" id="search-error" role="alert" hidden>No results</span>
                                <button type="submit">
                                    Search
                                </button> 
                            </div>
                        </form>
                        <p class="search-status" id="search-status" role="status"></p>

         </div>    
                </section>

        <section class="planetary-facts" aria-labelledby="planetary-facts-heading">

            
            <figure class="planet-table-wrapper">

                <table class="planet-table">

                    <thead>
                        <tr>
                            <th scope="col">Planet Type</th>
                            <th scope="col">Category</th>
                            <th scope="col">Name</th>
                            <th scope="col">Mass (10<sup>24</sup> kg)</th>
                            <th scope="col">Diameter (km)</th>
                        </tr>
                    </thead>

                    <tbody>

                        <!-- Terrestrial Planets -->
                        <tr>
                            <th scope="rowgroup" rowspan="4" colspan="2">
                                Terrestrial Planets
                            </th>

                            <td>Mercury</td>
                            <td>0.330</td>
                            <td>4,878</td>
                        </tr>

                        <tr>
                            <td>Venus</td>
                            <td>4.87</td>
                            <td>12,104</td>
                        </tr>

                        <tr>
                            <td>Earth</td>
                            <td>5.97</td>
                            <td>12,756</td>
                        </tr>

                        <tr>
                            <td>Mars</td>
                            <td>0.642</td>
                            <td>6,794</td>
                        </tr>


                        <!-- Jovian Planets - Gas Giants -->
                        <tr>
                            <th scope="rowgroup" rowspan="4">
                                Jovian Planets
                            </th>

                            <th scope="rowgroup" rowspan="2">
                                Gas Giants
                            </th>

                            <td>Jupiter</td>
                            <td>1898</td>
                            <td>142,984</td>
                        </tr>

                        <tr>
                            <td>Saturn</td>
                            <td>568</td>
                            <td>120,536</td>
                        </tr>


                        <!-- Jovian Planets - Ice Giants -->
                        <tr>
                            <th scope="rowgroup" rowspan="2">
                                Ice Giants
                            </th>

                            <td>Uranus</td>
                            <td>86.8</td>
                            <td>51,118</td>
                        </tr>

                        <tr>
                            <td>Neptune</td>
                            <td>102</td>
                            <td>49,528</td>
                        </tr>


                        <!-- Dwarf Planets -->
                        <tr>
                            <th scope="rowgroup" rowspan="1" colspan="2">
                                Dwarf Planets
                            </th>

                            <td>Pluto</td>
                            <td>0.0146</td>
                            <td>2,370</td>
                        </tr>

                    </tbody>

                </table>

            </figure>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
