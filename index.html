
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planetary Facts at a Glance</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <section
            class="planetary-facts"
            aria-labelledby="planetary-facts-heading"
        >
            <h1 id="planetary-facts-heading">
                Planetary Facts at a Glance
            </h1>

            <button
                id="theme-toggle"
                type="button"
                aria-pressed="false"
            >
                🌙 Switch to Dark Mode
            </button>

            <figure class="planet-table-wrapper">
                <table class="planet-table">
                    <caption>
                        Mass and diameter of the planets
                    </caption>

                    <thead>
                        <tr>
                            <th colspan="2" scope="colgroup">
                                Planet Types
                            </th>
                            <th scope="col">Name</th>
                            <th scope="col">
                                Mass (10<sup>24</sup> kg)
                            </th>
                            <th scope="col">Diameter (km)</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <th scope="rowgroup" rowspan="4" colspan="2">
                                Terrestrial Planets
                            </th>
                            <td>Mercury</td>
                            <td>0.000174</td>
                            <td>4,878</td>
                        </tr>

                        <tr>
                            <td>Venus</td>
                            <td>0.00256</td>
                            <td>12,104</td>
                        </tr>

                        <tr>
                            <td>Earth</td>
                            <td>0.00315</td>
                            <td>12,756</td>
                        </tr>

                        <tr>
                            <td>Mars</td>
                            <td>0.000338</td>
                            <td>6,794</td>
                        </tr>

                        <tr>
                            <th scope="rowgroup" rowspan="4">
                                Jovian Planets
                            </th>
                            <th scope="rowgroup" rowspan="2">
                                Gas Giants
                            </th>
                            <td>Jupiter</td>
                            <td>1.0</td>
                            <td>142,984</td>
                        </tr>

                        <tr>
                            <td>Saturn</td>
                            <td>0.299</td>
                            <td>120,536</td>
                        </tr>

                        <tr>
                            <th scope="rowgroup" rowspan="2">
                                Ice Giants
                            </th>
                            <td>Uranus</td>
                            <td>0.0457</td>
                            <td>51,118</td>
                        </tr>

                        <tr>
                            <td>Neptune</td>
                            <td>0.0539</td>
                            <td>49,528</td>
                        </tr>

                        <tr>
                            <th scope="rowgroup" colspan="2">
                                Dwarf Planets
                            </th>
                            <td>Pluto</td>
                            <td>0.0000069</td>
                            <td>2,370</td>
                        </tr>
                    </tbody>
                </table>
            </figure>
        </section>
    </main>
</body>
</html>
